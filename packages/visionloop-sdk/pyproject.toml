[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visionloop-sdk"
version = "1.0.0"
description = "VisionLoop Master Python SDK: Unified Financial, Telematics, Legal & Communications Automation Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "visionloop-finance",
    "visionloop-telematics",
    "visionloop-legal",
    "visionloop-comms"
]
authors = [
    { name = "Vision Loop Engineering", email = "engineering@visionloop.in" }
]
